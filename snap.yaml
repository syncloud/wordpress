apps:
  mariadb:
    user: wordpress
    command: bin/service.mariadb.sh
    daemon: simple
    plugs:
    - network
    - network-bind
    restart-condition: always
    start-timeout: 600s
    restart-delay: 10s

  php-fpm:
    user: wordpress
    command: bin/service.php-fpm.sh
    daemon: forking
    plugs:
    - network
    - network-bind
    restart-condition: always
    restart-delay: 10s

  nginx:
    command: bin/service.nginx.sh
    user: wordpress
    daemon: simple
    plugs:
    - network
    - network-bind
    restart-condition: always
    restart-delay: 10s

  wp-cli:
    command: bin/wp-cli
  
  php:
    command: bin/php.sh
    
confinement: strict
description: Wordpress
grade: stable
name: wordpress
summary: Wordpress
