apps:
  mariadb:
    user: wordpress
    command: bin/service.mariadb.sh
    daemon: simple
    plugs:
    - network
    - network-bind
    restart-condition: always
    start-timeout: 600s
    restart-delay: 10s

  php-fpm:
    user: wordpress
    command: bin/service.php-fpm.sh
    daemon: forking
    plugs:
    - network
    - network-bind
    restart-condition: always
    restart-delay: 10s

  nginx:
    command: bin/service.nginx.sh
    user: wordpress
    daemon: simple
    plugs:
    - network
    - network-bind
    restart-condition: always
    restart-delay: 10s

  storage-change:
    command: bin/cli storage-change

  access-change:
    command: bin/cli access-change

  backup-pre-stop:
    command: bin/cli backup-pre-stop

  restore-pre-start:
    command: bin/cli restore-pre-start

  restore-post-start:
    command: bin/cli restore-post-start

  wp-cli:
    command: bin/wp-cli
  
  php:
    command: bin/php.sh
    
confinement: strict
description: Blogging, mailing lists and forums, media galleries, and online stores
grade: stable
name: wordpress
summary: WordPress
